<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TGClone</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root{
  --bg:            #101018;
  --bg-alt:        #15151f;
  --surface:       #1b1c28;
  --surface-hi:    #23243333;
  --surface-hover: #242636;
  --border:        #2a2b3b;
  --border-soft:   #22232f;
  --text:          #eceefb;
  --text-dim:      #9497ad;
  --text-faint:    #5f6178;
  --accent-a:      #2481cc;
  --accent-b:      #2aabee;
  --accent-text:   #ffffff;
  --danger:        #ff6b81;
  --radius-lg: 20px;
  --radius-md: 14px;
  --radius-sm: 10px;
  --font-display: 'Space Grotesk', 'Inter', sans-serif;
  --font-body: 'Inter', sans-serif;
  --font-mono: 'JetBrains Mono', monospace;
}
[data-ui-theme="day"]{
  --bg:#edf1f6;
  --bg-alt:#f7f9fc;
  --surface:#ffffff;
  --surface-hi:#f1f4f8;
  --surface-hover:#e7edf4;
  --border:#d7dee8;
  --border-soft:#e2e8f0;
  --text:#1d2733;
  --text-dim:#667383;
  --text-faint:#91a0b0;
}
[data-ui-density="compact"] .chat-item{padding-top:7px; padding-bottom:7px;}
[data-ui-density="compact"] .search-box{margin-top:10px; margin-bottom:10px;}

[data-ui-font="tiny"]{--chat-font:11px;}
[data-ui-font="small"]{--chat-font:13px;}
[data-ui-font="medium"]{--chat-font:15px;}
[data-ui-font="large"]{--chat-font:17px;}
[data-ui-font="huge"]{--chat-font:19px;}
[data-ui-font] .msg{font-size:var(--chat-font,14px);}
[data-app-theme="mint"]{--accent-a:#16a085;--accent-b:#27ae60;--surface-hover:#17352d;}
[data-app-theme="sunset"]{--accent-a:#ff7a59;--accent-b:#f4b942;--surface-hover:#3b2921;}
[data-app-theme="ocean"]{--accent-a:#00a8cc;--accent-b:#4361ee;--surface-hover:#172d45;}
[data-app-theme="rose"]{--accent-a:#ef476f;--accent-b:#9b5de5;--surface-hover:#3a2036;}
[data-app-theme="forest"]{--accent-a:#6a994e;--accent-b:#a7c957;--surface-hover:#24351f;}
[data-app-theme="coral"]{--accent-a:#e76f51;--accent-b:#f4a261;--surface-hover:#3b2925;}
[data-app-theme="sky"]{--accent-a:#00b4d8;--accent-b:#90e0ef;--surface-hover:#183743;}
[data-app-theme="amber"]{--accent-a:#f4a261;--accent-b:#e9c46a;--surface-hover:#3b3020;}
[data-app-theme="berry"]{--accent-a:#c9184a;--accent-b:#ff758f;--surface-hover:#3b1e2b;}
[data-app-theme="citrus"]{--accent-a:#8ac926;--accent-b:#ffca3a;--surface-hover:#30341e;}
[data-app-theme="mono"]{--accent-a:#8d99ae;--accent-b:#edf2f4;--surface-hover:#303640;}
[data-chat-theme] .conv-messages{background-color:var(--bg);background-repeat:repeat;}

*{box-sizing:border-box;}
[hidden]{display:none !important;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:var(--font-body);
  -webkit-font-smoothing:antialiased;
  overflow:hidden;
}
button, input{font-family:inherit;}
:focus-visible{outline:2px solid var(--accent-b); outline-offset:2px;}

.screen{
  width:100vw;
  height:100vh;
  height:100dvh;
  min-height:0;
  overflow:hidden;
}

#auth-screen{
  position:relative;
  display:flex;
  align-items:center;
  justify-content:center;
  background:radial-gradient(ellipse 80% 60% at 50% 0%, #1c1d2c 0%, var(--bg) 60%);
  padding:24px;
}
#auth-screen[hidden], #app-screen[hidden]{
  display:none;
}

.auth-bg{
  position:absolute; inset:0;
  display:flex; align-items:center; justify-content:center;
  pointer-events:none;
  overflow:hidden;
}
.pulse-ring{
  position:absolute;
  border-radius:50%;
  border:1px solid var(--border);
  opacity:0;
  animation:ringPulse 6s ease-out infinite;
}
.pulse-ring.r1{width:280px;height:280px;animation-delay:0s;}
.pulse-ring.r2{width:280px;height:280px;animation-delay:2s;}
.pulse-ring.r3{width:280px;height:280px;animation-delay:4s;}
@keyframes ringPulse{
  0%{transform:scale(0.6); opacity:0;}
  15%{opacity:.35;}
  100%{transform:scale(2.6); opacity:0;}
}

.auth-card{
  position:relative;
  z-index:1;
  width:100%;
  max-width:380px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:var(--radius-lg);
  padding:36px 32px 28px;
  display:flex;
  flex-direction:column;
  gap:6px;
  box-shadow:0 30px 60px -20px rgba(0,0,0,.6);
}

.auth-mark{
  width:44px;height:44px;
  border-radius:12px;
  margin-bottom:14px;
  background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
  display:flex; align-items:center; justify-content:center;
}
.auth-mark-dot{
  width:10px;height:10px;border-radius:50%;
  background:var(--accent-text);
}

.auth-title{
  font-family:var(--font-display);
  font-size:28px;
  font-weight:700;
  margin:0;
  letter-spacing:-0.02em;
}
.auth-subtitle{
  margin:0 0 20px;
  color:var(--text-dim);
  font-size:14px;
}

.field{
  display:flex;
  flex-direction:column;
  gap:6px;
  margin-bottom:14px;
}
.field-label{
  font-size:12px;
  font-weight:600;
  color:var(--text-dim);
  text-transform:uppercase;
  letter-spacing:.06em;
}
.field input{
  background:var(--bg-alt);
  border:1px solid var(--border);
  border-radius:var(--radius-sm);
  padding:12px 14px;
  color:var(--text);
  font-size:15px;
}
.field input::placeholder{color:var(--text-faint);}
.field input:focus{
  border-color:var(--accent-b);
  background:#191a26;
}
.field-hint{
  font-size:11px;
  color:var(--text-faint);
}

.btn-primary{
  position:relative;
  margin-top:8px;
  border:none;
  border-radius:var(--radius-sm);
  padding:13px 16px;
  background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
  color:var(--accent-text);
  font-size:15px;
  font-weight:600;
  cursor:pointer;
  box-shadow:0 10px 24px -10px rgba(36,129,204,.55);
}
.btn-primary:hover{transform:translateY(-1px);}
.btn-primary:disabled{opacity:.65; cursor:default;}
.btn-spinner{
  display:none;
  position:absolute; right:16px; top:50%;
  width:16px;height:16px;
  margin-top:-8px;
  border:2px solid rgba(255,255,255,.4);
  border-top-color:#fff;
  border-radius:50%;
  animation:spin .7s linear infinite;
}
.btn-primary.loading .btn-spinner{display:block;}
.btn-primary.loading .btn-label{opacity:.6;}
@keyframes spin{to{transform:rotate(360deg);}}

.auth-error{
  margin:12px 0 0;
  padding:10px 12px;
  border-radius:var(--radius-sm);
  background:rgba(255,107,129,.1);
  border:1px solid rgba(255,107,129,.35);
  color:var(--danger);
  font-size:13px;
}

.app-shell{
  display:flex;
  height:100%;
  min-height:0;
  min-width:0;
  overflow:hidden;
}

.avatar{
  --size:40px;
  width:var(--size); height:var(--size);
  border-radius:50%;
  background:linear-gradient(135deg, var(--accent-a), var(--accent-b));
  display:flex; align-items:center; justify-content:center;
  color:#fff; font-weight:600; font-size:15px;
  flex-shrink:0;
  font-family:var(--font-display);
}

.sidebar{
  position:relative;
  width:360px;
  min-width:360px;
  background:var(--bg-alt);
  border-right:1px solid var(--border-soft);
  display:flex;
  flex-direction:column;
  height:100%;
  min-height:0;
  overflow:hidden;
}

.sidebar-top{
  display:flex; align-items:center; gap:12px;
  padding:12px 16px 8px;
}
.sidebar-top .avatar{cursor:pointer;}
.search-box{
  flex:1;
  display:flex; align-items:center; gap:8px;
  background:var(--surface);
  border:1px solid var(--border);
  border-radius:20px;
  padding:8px 14px;
}
.search-box:focus-within{border-color:var(--accent-b);}
.search-icon{color:var(--text-faint); font-size:14px;}
.search-box input{
  border:none; background:none; outline:none;
  color:var(--text); font-size:14px; width:100%;
}
.search-box input::placeholder{color:var(--text-faint);}

.chat-tabs{display:flex; gap:6px; padding:6px 16px 10px; overflow-x:auto; scrollbar-width:none;}
.chat-tab{border:0; background:var(--surface-hi); color:var(--text-dim); padding:6px 12px; border-radius:14px; white-space:nowrap; font-size:12px; cursor:pointer;}
.chat-tab.active{background:var(--accent-a); color:#fff; font-weight:bold;}

.chat-list-wrap{flex:1; overflow-y:auto;}
.chat-list{padding:0 8px; display:flex; flex-direction:column; gap:2px;}

.chat-item{
  display:flex; align-items:center; gap:10px;
  padding:10px;
  border-radius:var(--radius-md);
  cursor:pointer;
  transition:background .12s;
}
.chat-item:hover{background:var(--surface-hover);}
.chat-item.active{background:var(--surface-hover); border-color:var(--border);}
.chat-item-body{min-width:0; flex:1;}
.chat-item-name{font-size:14px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis;}
.chat-item-preview{font-size:12px; color:var(--text-dim); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px;}

.app-nav{
  display:flex;
  align-items:center;
  justify-content:space-around;
  padding:6px 12px;
  background:var(--surface);
  border-top:1px solid var(--border-soft);
}
.app-nav-btn{
  position:relative;
  border:0;
  background:transparent;
  color:var(--text-dim);
  cursor:pointer;
  display:flex;
  flex-direction:column;
  align-items:center;
  padding:4px 18px;
  transition:color .15s;
}
.app-nav-btn:hover{color:var(--text);}
.app-nav-btn.active{color:var(--accent-a); font-weight:bold;}
.app-nav-icon{font-size:20px; line-height:1;}
.app-nav-label{font-size:11px; margin-top:3px;}

.app-nav-btn.plus-btn{padding:0;}
.app-nav-btn.plus-btn .plus-circle{
  width:44px; height:44px; border-radius:50%;
  background:var(--accent-a); color:#fff;
  display:flex; align-items:center; justify-content:center;
  font-size:24px; font-weight:bold;
  box-shadow:0 4px 12px rgba(36,129,204,.4);
}

.nav-indicator{
  width:22px; height:3px; border-radius:2px;
  background:transparent; margin-top:3px;
}
.app-nav-btn.active .nav-indicator{background:var(--accent-a);}

.conversation{
  flex:1;
  display:flex;
  flex-direction:column;
  background:var(--bg);
  min-width:0;
  min-height:0;
  overflow:hidden;
}
.conv-empty{
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  gap:6px; color:var(--text-dim); text-align:center; padding:24px;
}
.conv-empty h2{margin:0; font-family:var(--font-display); font-size:18px; color:var(--text);}
.conv-active{display:flex; flex-direction:column; height:100%; position:relative; min-height:0;}

.conv-header{
  display:flex; align-items:center; gap:12px;
  padding:12px 18px;
  border-bottom:1px solid var(--border-soft);
  background:var(--bg-alt);
}
.conv-back{font-size:20px; border:0; background:none; color:var(--text); cursor:pointer; padding:4px;}
.conv-header-identity{display:flex; align-items:center; gap:12px; min-width:0; flex:1; border:0; background:transparent; padding:0; margin:0; cursor:pointer; text-align:left; color:inherit; font:inherit;}
.conv-header-info{display:flex; flex-direction:column; min-width:0;}
.conv-header-name{font-size:15px; font-weight:600;}
.conv-header-status{font-size:12px; color:var(--text-faint);}
.conv-header-actions{display:flex; gap:10px; margin-left:auto;}

.conv-messages{
  flex:1; overflow-y:auto; padding:18px;
  display:flex; flex-direction:column; gap:8px;
}
.msg{
  max-width:70%; padding:9px 13px; border-radius:15px; font-size:14px; line-height:1.4;
}
.msg.out{align-self:flex-end; background:var(--accent-a); color:#fff; border-bottom-right-radius:4px;}
.msg.in{align-self:flex-start; background:var(--surface); border:1px solid var(--border-soft); border-bottom-left-radius:4px;}

.conv-input-bar{
  position:relative;
  display:flex; align-items:center; gap:8px;
  padding:10px 16px;
  border-top:1px solid var(--border-soft);
  background:var(--bg-alt);
}
.conv-input-bar input{
  flex:1; background:var(--surface); border:1px solid var(--border);
  border-radius:20px; padding:10px 16px; color:var(--text); font-size:14px; outline:none;
}
.conv-input-bar input:focus{border-color:var(--accent-b);}
.send-btn{
  width:38px; height:38px; border-radius:50%; border:none;
  background:var(--accent-a); color:#fff; font-size:15px; cursor:pointer;
  display:flex; align-items:center; justify-content:center; flex-shrink:0;
}

.icon-btn{
  width:36px; height:36px; border-radius:50%; border:none;
  background:transparent; color:var(--text-dim); cursor:pointer; font-size:18px;
  display:flex; align-items:center; justify-content:center;
}
.icon-btn:hover{background:var(--surface-hover); color:var(--text);}

.modal-backdrop{
  position:fixed; inset:0; z-index:50;
  display:flex; align-items:center; justify-content:center;
  background:rgba(0,0,0,0.65); padding:16px;
}
.modal-backdrop[hidden]{display:none !important;}

.create-sheet, .settings-window{
  width:100%; max-width:440px; background:var(--surface);
  border:1px solid var(--border); border-radius:20px;
  padding:24px; position:relative; max-height:85vh; overflow-y:auto;
}

.modal-head-row{
  display:flex; align-items:center; gap:12px; margin-bottom:18px;
}
.modal-back-btn{
  border:0; background:none; color:var(--text); font-size:22px; cursor:pointer; padding:4px;
}
.modal-title{margin:0; font-size:20px; font-weight:bold; flex:1;}
.modal-close{
  position:absolute; right:16px; top:16px;
  border:0; background:none; color:var(--text-dim); font-size:22px; cursor:pointer;
}

.create-action{
  width:100%; display:flex; align-items:center; gap:12px;
  padding:12px 14px; margin-top:8px;
  border:1px solid var(--border); border-radius:12px;
  background:var(--bg); color:var(--text); cursor:pointer; text-align:left;
}
.create-action:hover{background:var(--surface-hover); border-color:var(--accent-b);}
.create-action span{font-size:22px;}
.create-action strong{font-size:14px; display:block;}
.create-action small{font-size:11px; color:var(--text-dim); display:block; margin-top:2px;}

.profile-field{display:flex; flex-direction:column; gap:6px; margin-bottom:12px; font-size:13px; color:var(--text-dim);}
.profile-field input{background:var(--bg); border:1px solid var(--border); border-radius:10px; padding:10px 12px; color:var(--text); font-size:14px; outline:none;}
.settings-save{width:100%; border:0; border-radius:10px; padding:12px; background:var(--accent-a); color:#fff; font-weight:600; cursor:pointer; margin-top:12px;}

.chat-theme-grid{display:flex; gap:8px; margin-top:8px; flex-wrap:wrap;}
.theme-swatch{width:36px; height:36px; border-radius:50%; border:2px solid transparent; cursor:pointer;}
.theme-swatch.active{border-color:#fff; transform:scale(1.1);}

.call-overlay{
  position:fixed; inset:0; z-index:100;
  display:flex; flex-direction:column; align-items:center; justify-content:space-between;
  padding:32px 20px; background:#070b0e; color:#fff;
}
.call-overlay[hidden]{display:none !important;}
#call-local-video{
  position:absolute; right:16px; bottom:140px;
  width:110px; height:150px; border-radius:14px;
  border:2px solid var(--accent-a); background:#1c2630;
  cursor:move; z-index:110; object-fit:cover;
}
.call-controls{display:flex; gap:20px; align-items:center;}
.call-btn{
  width:52px; height:52px; border-radius:50%; border:0;
  background:rgba(255,255,255,.15); color:#fff; font-size:22px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
}
.call-btn.decline, .call-btn.hangup{background:var(--danger); width:64px; height:64px;}

@media (max-width: 760px){
  .sidebar{width:100%; min-width:0;}
  .conversation{
    position:absolute; inset:0; transform:translateX(100%);
    transition:transform .22s ease; z-index:10;
  }
  .conversation.open{transform:translateX(0);}
}
</style>
</head>
<body>

<section id="auth-screen" class="screen">
  <form id="auth-form" class="auth-card" autocomplete="off">
    <div class="auth-mark">✈</div>
    <h1 class="auth-title">TGClone</h1>
    <p class="auth-subtitle">Свой канал связи. Без лишних данных.</p>
    <label class="field">
      <span class="field-label">Username (ID)</span>
      <input id="input-username" type="text" placeholder="alex_dev" required pattern="[a-zA-Z0-9_]{3,20}" maxlength="20">
    </label>
    <label class="field">
      <span class="field-label">Имя (Никнейм)</span>
      <input id="input-displayname" type="text" placeholder="Александр" required maxlength="40">
    </label>
    <button id="auth-submit" type="submit" class="btn-primary">Войти</button>
    <p id="auth-error" class="auth-error" hidden></p>
  </form>
</section>

<section id="app-screen" class="screen" hidden>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-top">
        <span class="avatar" id="me-avatar" onclick="openSettingsModal()" title="Настройки"></span>
        <div class="search-box">
          <span class="search-icon">🔍</span>
          <input id="search-input" type="text" placeholder="Поиск 🔍" autocomplete="off">
        </div>
      </div>

      <div class="chat-tabs" id="chat-tabs">
        <button class="chat-tab active" data-filter="all" type="button">Все</button>
        <button class="chat-tab" data-filter="personal" type="button">Чат</button>
        <button class="chat-tab" data-filter="groups" type="button">Груп</button>
        <button class="chat-tab" data-filter="channels" type="button">Канал</button>
      </div>

      <div id="search-results" style="padding:0 16px; max-height:200px; overflow-y:auto;" hidden></div>

      <div class="chat-list-wrap">
        <div id="chat-list" class="chat-list"></div>
      </div>

      <nav class="app-nav" aria-label="Навигация">
        <button class="app-nav-btn active" id="nav-chats" type="button">
          <span class="app-nav-icon">💬</span>
          <span class="app-nav-label">чат</span>
          <div class="nav-indicator"></div>
        </button>

        <button class="app-nav-btn plus-btn" id="nav-plus" type="button" title="Создать">
          <div class="plus-circle">+</div>
        </button>

        <button class="app-nav-btn" id="nav-settings" type="button">
          <span class="app-nav-icon">⚙</span>
          <span class="app-nav-label">настройки</span>
          <div class="nav-indicator"></div>
        </button>
      </nav>
    </aside>

    <main class="conversation" id="conversation">
      <div class="conv-empty" id="conv-empty">
        <h2>Выберите чат</h2>
        <p>Или нажмите "+" снизу для создания нового диалога.</p>
      </div>

      <div class="conv-active" id="conv-active" hidden>
        <header class="conv-header">
          <button class="conv-back" id="conv-back" type="button" title="Назад">←</button>
          <button class="conv-header-identity" id="conv-header-identity" type="button">
            <span class="avatar" id="conv-avatar"></span>
            <div class="conv-header-info">
              <span class="conv-header-name" id="conv-header-name">—</span>
              <span class="conv-header-status" id="conv-header-status">в сети</span>
            </div>
          </button>
          <div class="conv-header-actions">
            <button class="icon-btn" id="call-audio-btn" type="button" title="Аудиозвонок">📞</button>
            <button class="icon-btn" id="call-video-btn" type="button" title="Видеозвонок">📹</button>
          </div>
        </header>

        <div class="conv-messages" id="conv-messages"></div>

        <form id="message-form" class="conv-input-bar" autocomplete="off">
          <button type="button" id="attach-btn" class="icon-btn" title="Прикрепить фото или файл">📎</button>
          <input type="file" id="attach-photo-input" accept="image/*" hidden>
          <input type="file" id="attach-file-input" hidden>

          <input id="message-input" type="text" placeholder="Сообщение..." maxlength="1000">

          <button type="button" id="media-mode-btn" class="icon-btn" title="Сменить режим">◉</button>
          <button type="button" id="media-btn" class="icon-btn" title="Запись">🎤</button>
          <button type="submit" class="send-btn" title="Отправить">➤</button>
        </form>
      </div>
    </main>
  </div>
</section>

  <section class="settings-window">
    <div class="modal-head-row">
      <button class="modal-back-btn" id="settings-back-btn" type="button" title="Назад в чаты">←</button>
      <h2 class="modal-title">Настройки</h2>
    </div>

    <div style="display:flex; align-items:center; gap:12px; margin-bottom:20px;">
      <span class="avatar" id="settings-my-avatar" style="--size:54px; font-size:20px;"></span>
      <div>
        <div style="font-weight:bold; font-size:17px;" id="settings-my-name">—</div>

      </div>

    <div style="margin-bottom:16px;">
      <label class="profile-field"><span>Отображаемое имя</span><input id="profile-name" type="text"></label>

  <section class="create-sheet">
    <button class="modal-close" data-close-modal="space-modal" type="button">×</button>
    <h2 id="space-modal-title" style="margin:0 0 14px; font-size:20px;">Новое пространство</h2>
    <label class="profile-field"><span>Название</span><input id="space-name-input" type="text" placeholder="Название..."></label>
    <label class="profile-field"><span>Название ID (@username)</span><input id="space-id-input" type="text" placeholder="my_channel"></label>
    <label class="profile-field"><span>Описание (можно не делать)</span><input id="space-description-input" type="text" placeholder="Описание..."></label>
    <label class="profile-field" style="flex-direction:row; align-items:center; justify-content:space-between;">
      <span>Закрытый (не ищется в поиске)</span>
      <input type="checkbox" id="space-private-input">
    </label>

    <div style="margin-top:12px;">
      <span style="font-size:12px; color:var(--text-dim); display:block; margin-bottom:6px;">Цвет фона (8 цветов):</span>
      <div class="chat-theme-grid" id="space-theme-grid"></div>
    </div>

    <button class="settings-save" id="space-save-btn" type="button">Создать</button>
    <p id="space-error" class="auth-error" hidden></p>

<div class="call-overlay" id="call-overlay" hidden>
  <div style="font-size:16px; font-weight:bold; color:var(--accent-b);" id="call-timer">00:12</div>
  <div style="text-align:center;">
    <div class="avatar" id="call-avatar-big" style="--size:110px; font-size:42px; margin:0 auto 16px;">?</div>
    <div style="font-size:22px; font-weight:bold;" id="call-peer-name">—</div>
    <div style="color:var(--text-dim); font-size:14px; margin-top:4px;" id="call-status-text">Вызов…</div>
  </div>

  <video id="call-remote-video" autoplay playsinline style="position:fixed; inset:0; width:100%; height:100%; object-fit:cover; z-index:105;" hidden></video>
  <video id="call-local-video" autoplay playsinline muted hidden></video>

  <div class="call-controls" style="z-index:115;">
    <button class="call-btn" id="call-mute-btn" type="button" title="Микрофон">🎤</button>
    <button class="call-btn" id="call-camera-btn" type="button" title="Камера">📹</button>
    <button class="call-btn decline" id="call-decline-btn" type="button" title="Завершить">📞</button>
  </div>
</div>

<script>
const API_BASE = window.location.origin;
const STORAGE_KEY = 'tgclone_user';
const SPACE_COLORS = ['#2481cc', '#1976d2', '#00897b', '#43a047', '#7b1fa2', '#e65100', '#c2185b', '#37474f'];

const authScreen = document.getElementById('auth-screen');
const appScreen = document.getElementById('app-screen');
const authForm = document.getElementById('auth-form');
const usernameEl = document.getElementById('input-username');
const displayEl = document.getElementById('input-displayname');
const authSubmit = document.getElementById('auth-submit');
const authError = document.getElementById('auth-error');

const meAvatar = document.getElementById('me-avatar');
const searchInput = document.getElementById('search-input');
const searchResults = document.getElementById('search-results');
const chatList = document.getElementById('chat-list');

const navChats = document.getElementById('nav-chats');
const navPlus = document.getElementById('nav-plus');
const navSettings = document.getElementById('nav-settings');

const conversation = document.getElementById('conversation');
const convEmpty = document.getElementById('conv-empty');
const convActive = document.getElementById('conv-active');
const convAvatar = document.getElementById('conv-avatar');
const convName = document.getElementById('conv-header-name');
const convStatus = document.getElementById('conv-header-status');
const convMessages = document.getElementById('conv-messages');
const convBack = document.getElementById('conv-back');
const messageForm = document.getElementById('message-form');
const messageInput = document.getElementById('message-input');
const mediaBtn = document.getElementById('media-btn');
const mediaModeBtn = document.getElementById('media-mode-btn');

const createModal = document.getElementById('create-modal');
const settingsModal = document.getElementById('settings-modal');
const addContactModal = document.getElementById('add-contact-modal');
const spaceModal = document.getElementById('space-modal');

const openChats = new Map();
let activeChatId = null;
let currentFolder = 'all';
let isVideoMode = false;
let selectedSpaceColor = SPACE_COLORS[0];

function initials(name){
  if(!name) return '?';
  return name.trim().split(/\s+/).slice(0,2).map(w => w[0]?.toUpperCase() || '').join('');
}
function getCurrentUser(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY) || 'null'); }catch{ return null; }
}
function setCurrentUser(u){ localStorage.setItem(STORAGE_KEY, JSON.stringify(u)); }

function openModal(el){ el.hidden = false; }
function closeModal(el){ el.hidden = true; }

document.querySelectorAll('[data-close-modal]').forEach(b => {
  b.addEventListener('click', () => closeModal(document.getElementById(b.dataset.closeModal)));
});

navChats.addEventListener('click', () => {
  navChats.classList.add('active');
  navSettings.classList.remove('active');
  closeModal(settingsModal);
  conversation.classList.remove('open');
});
navPlus.addEventListener('click', () => openModal(createModal));
navSettings.addEventListener('click', () => openSettingsModal());

function openSettingsModal(){
  navSettings.classList.add('active');
  navChats.classList.remove('active');
  const u = getCurrentUser();
  if(u){
    document.getElementById('settings-my-avatar').textContent = initials(u.display_name);
    document.getElementById('settings-my-name').textContent = u.display_name;
    document.getElementById('settings-my-username').textContent = '@' + u.username;
    document.getElementById('profile-name').value = u.display_name;
  }
  openModal(settingsModal);
}
function closeSettingsModal(){
  closeModal(settingsModal);
  navChats.classList.add('active');
  navSettings.classList.remove('active');
}
document.getElementById('settings-back-btn').addEventListener('click', closeSettingsModal);

document.querySelectorAll('.chat-tab').forEach(t => {
  t.addEventListener('click', () => {
    document.querySelectorAll('.chat-tab').forEach(x => x.classList.remove('active'));
    t.classList.add('active');
    currentFolder = t.dataset.filter;
    renderChatList();
  });
});

mediaModeBtn.addEventListener('click', () => {
  isVideoMode = !isVideoMode;
  mediaBtn.textContent = isVideoMode ? '◉' : '🎤';
  mediaModeBtn.textContent = isVideoMode ? '🎤' : '◉';
});

document.querySelectorAll('[data-space-kind]').forEach(b => {
  b.addEventListener('click', () => {
    closeModal(createModal);
    const kind = b.dataset.spaceKind;
    document.getElementById('space-modal-title').textContent = kind === 'channel' ? 'Создать канал' : 'Создать группу';
    document.getElementById('space-name-input').value = '';
    document.getElementById('space-id-input').value = '';
    renderSpaceColors();
    openModal(spaceModal);
  });
});

function renderSpaceColors(){
  const wrap = document.getElementById('space-theme-grid');
  wrap.innerHTML = '';
  SPACE_COLORS.forEach((col, idx) => {
    const sw = document.createElement('div');
    sw.className = `theme-swatch ${idx === 0 ? 'active' : ''}`;
    sw.style.background = col;
    sw.onclick = () => {
      document.querySelectorAll('.theme-swatch').forEach(s => s.classList.remove('active'));
      sw.classList.add('active');
      selectedSpaceColor = col;
    };
    wrap.appendChild(sw);
  });
}

document.getElementById('space-save-btn').addEventListener('click', async () => {
  const me = getCurrentUser(); if(!me) return;
  const name = document.getElementById('space-name-input').value.trim();
  const id = document.getElementById('space-id-input').value.trim();
  const desc = document.getElementById('space-description-input').value.trim();
  const isPrivate = document.getElementById('space-private-input').checked;
  if(!name) return alert('Введите название');

  try{
    const res = await fetch(`${API_BASE}/api/spaces`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner_id: me.id, name, kind: 'group', description: desc, is_private: isPrivate })
    });
    if(!res.ok) throw new Error('Не удалось создать');
    closeModal(spaceModal);
    loadSpaces();
  }catch(err){
    document.getElementById('space-error').textContent = err.message;
    document.getElementById('space-error').hidden = false;
  }
});

document.getElementById('add-user-action').addEventListener('click', () => {
  closeModal(createModal);
  openModal(addContactModal);
});
document.getElementById('add-contact-submit-btn').addEventListener('click', async () => {
  const me = getCurrentUser(); if(!me) return;
  const user = document.getElementById('add-contact-input').value.trim().replace(/^@/,'');
  if(!user) return;
  try{
    const res = await fetch(`${API_BASE}/api/contacts`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ owner_id: me.id, username: user })
    });
    if(!res.ok) throw new Error('Не удалось добавить контакт');
    closeModal(addContactModal);
    loadContacts();
  }catch(err){
    document.getElementById('add-contact-error').textContent = err.message;
    document.getElementById('add-contact-error').hidden = false;
  }
});

authForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const username = usernameEl.value.trim();
  const display_name = displayEl.value.trim();
  if(!username || !display_name) return;

  try{
    const res = await fetch(`${API_BASE}/api/users`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, display_name })
    });
    const user = await res.json();
    setCurrentUser({ id: user.id, username: user.username, display_name: user.display_name });
    enterApp();
  }catch(err){
    authError.textContent = err.message;
    authError.hidden = false;
  }
});

function enterApp(){
  const user = getCurrentUser();
  if(!user){ authScreen.hidden = false; appScreen.hidden = true; return; }
  authScreen.hidden = true;
  appScreen.hidden = false;
  meAvatar.textContent = initials(user.display_name);
  loadSpaces();
  loadContacts();
  loadConversations();
  startPolling();
  initDraggableLocalVideo();
}

async function loadSpaces(){
  const me = getCurrentUser(); if(!me) return;
  const res = await fetch(`${API_BASE}/api/spaces/${encodeURIComponent(me.id)}`);
  if(!res.ok) return;
  const spaces = await res.json();
  spaces.forEach(s => {
    openChats.set(s.id, { id: s.id, display_name: s.name, username: s.kind, kind: s.kind, messages: [], lastCount: 0 });
  });
  renderChatList();
}

async function loadContacts(){
  const me = getCurrentUser(); if(!me) return;
  const res = await fetch(`${API_BASE}/api/contacts/${encodeURIComponent(me.id)}`);
  if(!res.ok) return;
  const contacts = await res.json();
  contacts.forEach(c => {
    if(!openChats.has(c.id)) openChats.set(c.id, { id: c.id, display_name: c.display_name, username: c.username, kind: 'personal', messages: [], lastCount: 0 });
  });
  renderChatList();
}

async function loadConversations(){
  const me = getCurrentUser(); if(!me) return;
  const res = await fetch(`${API_BASE}/api/conversations/${encodeURIComponent(me.id)}`);
  if(!res.ok) return;
  const users = await res.json();
  users.forEach(u => {
    if(!openChats.has(u.id)) openChats.set(u.id, { id: u.id, display_name: u.display_name, username: u.username, kind: 'personal', messages: [], lastCount: 0 });
  });
  renderChatList();
}

function renderChatList(){
  const query = searchInput.value.toLowerCase().trim();
  chatList.innerHTML = '';

  const list = [...openChats.values()].filter(c => {
    const matchFolder = currentFolder === 'all' ||
      (currentFolder === 'personal' && c.kind === 'personal') ||
      (currentFolder === 'groups' && c.kind === 'group') ||
      (currentFolder === 'channels' && c.kind === 'channel');
    const matchQuery = !query || c.display_name.toLowerCase().includes(query) || c.username.toLowerCase().includes(query);
    return matchFolder && matchQuery;
  });

  if(!list.length){
    chatList.innerHTML = `
      <div style="padding:40px 20px; text-align:center; color:var(--text-dim);">
        <div style="font-size:42px; margin-bottom:8px;">💬</div>
        <p style="font-size:16px; font-weight:bold; color:var(--text); margin-bottom:4px;">Пока пусто</p>
        <p style="font-size:12px;">Нажмите "+" снизу, чтобы создать чат, группу или канал</p>
      </div>`;
    return;
  }

  list.forEach(c => {
    const item = document.createElement('div');
    item.className = 'chat-item' + (c.id === activeChatId ? ' active' : '');
    item.innerHTML = `
      <span class="avatar">${escapeHtml(initials(c.display_name))}</span>
      <div class="chat-item-body">
        <div class="chat-item-name">${escapeHtml(c.display_name)}</div>
        <div class="chat-item-preview">${escapeHtml(c.kind ? (c.kind === 'channel' ? 'канал' : 'группа') : '@' + c.username)}</div>
      </div>`;
    item.onclick = () => openChatRoom(c);
    chatList.appendChild(item);
  });
}

function openChatRoom(chat){
  activeChatId = chat.id;
  convEmpty.hidden = true;
  convActive.hidden = false;
  conversation.classList.add('open');
  convAvatar.textContent = initials(chat.display_name);
  convName.textContent = chat.display_name;
  convStatus.textContent = chat.kind ? (chat.kind === 'channel' ? 'Канал' : 'Группа') : 'в сети';
  renderChatList();
  refreshMessages(chat);
}

convBack.addEventListener('click', () => {
  conversation.classList.remove('open');
});

async function refreshMessages(chat){
  const me = getCurrentUser(); if(!me) return;
  const isSpace = chat.kind === 'group' || chat.kind === 'channel';
  const url = isSpace
    ? `${API_BASE}/api/space-messages/${encodeURIComponent(chat.id)}`
    : `${API_BASE}/api/messages?user_a=${encodeURIComponent(me.id)}&user_b=${encodeURIComponent(chat.id)}`;
  try{
    const res = await fetch(url);
    if(!res.ok) return;
    const msgs = await res.json();
    chat.messages = msgs;
    renderMessages(chat);
  }catch{}
}

function renderMessages(chat){
  convMessages.innerHTML = '';
  const me = getCurrentUser();
  chat.messages.forEach(m => {
    const b = document.createElement('div');
    b.className = 'msg ' + (m.from_user === me.id ? 'out' : 'in');
    if(m.type === 'image' && m.audio_data){
      b.innerHTML = `<img src="${m.audio_data}" style="max-width:240px; border-radius:10px; display:block;">`;
    }else if(m.type === 'file' && m.audio_data){
      b.innerHTML = `<a href="${m.audio_data}" download="${m.text || 'file'}" style="color:inherit; text-decoration:underline;">📄 ${m.text || 'Файл'}</a>`;
    }else{
      b.textContent = m.text || '';
    }
    convMessages.appendChild(b);
  });
  convMessages.scrollTop = convMessages.scrollHeight;
}

messageForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const text = messageInput.value.trim();
  const me = getCurrentUser();
  if(!text || !activeChatId || !me) return;
  const chat = openChats.get(activeChatId);
  messageInput.value = '';

  const isSpace = chat.kind === 'group' || chat.kind === 'channel';
  const url = isSpace ? `${API_BASE}/api/space-messages` : `${API_BASE}/api/messages`;
  const body = isSpace
    ? { space_id: chat.id, from_user: me.id, text }
    : { from_user: me.id, to_user: chat.id, text };

  await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  refreshMessages(chat);
});

document.getElementById('attach-btn').onclick = () => {
  document.getElementById('attach-photo-input').click();
};
document.getElementById('attach-photo-input').onchange = async () => {
  const file = document.getElementById('attach-photo-input').files[0];
  if(!file || !activeChatId) return;
  const reader = new FileReader();
  reader.onload = async () => {
    const me = getCurrentUser();
    const chat = openChats.get(activeChatId);
    const isSpace = chat.kind === 'group' || chat.kind === 'channel';
    const body = isSpace
      ? { space_id: chat.id, from_user: me.id, type: 'image', text: file.name, audio_data: reader.result }
      : { from_user: me.id, to_user: chat.id, type: 'image', text: file.name, audio_data: reader.result };
    await fetch(`${API_BASE}/api/${isSpace ? 'space-messages' : 'messages'}`, {
      method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body)
    });
    refreshMessages(chat);
  };
  reader.readAsDataURL(file);
};

let pollTimer = null;
function startPolling(){
  clearInterval(pollTimer);
  pollTimer = setInterval(() => {
    if(activeChatId){
      const c = openChats.get(activeChatId);
      if(c) refreshMessages(c);
    }
  }, 1000);
}

function initDraggableLocalVideo(){
  const el = document.getElementById('call-local-video');
  if(!el) return;
  let dragging = false, startX = 0, startY = 0, origLeft = 0, origTop = 0;

  el.addEventListener('pointerdown', e => {
    dragging = true;
    el.setPointerCapture(e.pointerId);
    const r = el.getBoundingClientRect();
    startX = e.clientX; startY = e.clientY;
    origLeft = r.left; origTop = r.top;
    el.style.right = 'auto'; el.style.bottom = 'auto';
    el.style.left = origLeft + 'px'; el.style.top = origTop + 'px';
  });
  el.addEventListener('pointermove', e => {
    if(!dragging) return;
    el.style.left = (origLeft + (e.clientX - startX)) + 'px';
    el.style.top = (origTop + (e.clientY - startY)) + 'px';
  });
  const stop = () => { dragging = false; };
  el.addEventListener('pointerup', stop);
  el.addEventListener('pointercancel', stop);
}

document.getElementById('call-audio-btn').onclick = () => {
  document.getElementById('call-peer-name').textContent = convName.textContent;
  document.getElementById('call-local-video').hidden = true;
  document.getElementById('call-overlay').hidden = false;
};
document.getElementById('call-video-btn').onclick = () => {
  document.getElementById('call-peer-name').textContent = convName.textContent;
  document.getElementById('call-local-video').hidden = false;
  document.getElementById('call-overlay').hidden = false;
};
document.getElementById('call-decline-btn').onclick = () => {
  document.getElementById('call-overlay').hidden = true;
};

document.getElementById('logout-btn').onclick = () => {
  localStorage.removeItem(STORAGE_KEY);
  location.reload();
};

function escapeHtml(s){
  const d = document.createElement('div');
  d.textContent = s || '';
  return d.innerHTML;
}

enterApp();
</script>
</body>
</html>
